# ---------------------------------------------------------------------
#  RESUMO DIÁRIO PARA O CANAL DO WHATSAPP
#  1x por dia (a partir da hora abaixo) o robô manda no SEU privado do
#  Telegram os melhores achados, já formatados para colar no WhatsApp.
